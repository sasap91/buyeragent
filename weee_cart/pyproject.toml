[project]
name = "mandatelab-weee-cart"
version = "0.1.0"
description = "MandateLab: put approved basket lines into a live Weee! cart"
requires-python = ">=3.11"
dependencies = ["mandatelab-contracts", "mandatelab-engine", "playwright"]

[tool.uv.sources]
mandatelab-contracts = { workspace = true }
mandatelab-engine = { workspace = true }

[build-system]
requires = ["uv_build>=0.12.3,<0.13.0"]
build-backend = "uv_build"
