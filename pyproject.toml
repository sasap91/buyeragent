[project]
name = "mandatelab-workspace"
version = "0.1.0"
description = "MandateLab hackathon workspace"
requires-python = ">=3.11"
dependencies = [
    "mandatelab-contracts",
    "mandatelab-engine",
    "mandatelab-sandbox-executor",
]

[dependency-groups]
dev = [
    "pytest>=8.3,<10",
]

[tool.uv]
package = false

[tool.uv.sources]
mandatelab-contracts = { workspace = true }
mandatelab-engine = { workspace = true }
mandatelab-sandbox-executor = { workspace = true }

[tool.uv.workspace]
members = [
    "contracts",
    "mandate_engine",
    "sandbox_executor",
    "user_profile",
]

[tool.pytest.ini_options]
addopts = "-ra"
pythonpath = ["contracts/src", "mandate_engine/src", "sandbox_executor/src"]
