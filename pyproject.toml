[project]
name = "mandatelab-workspace"
version = "0.1.0"
description = "MandateLab hackathon workspace"
requires-python = ">=3.11"
dependencies = [
    "mandatelab-api",
    "mandatelab-contracts",
    "mandatelab-engine",
    "mandatelab-sandbox-executor",
    "user-profile",
]

[dependency-groups]
dev = [
    "pytest>=8.3,<10",
]

[tool.uv]
package = false

[tool.uv.sources]
mandatelab-api = { workspace = true }
mandatelab-contracts = { workspace = true }
mandatelab-engine = { workspace = true }
mandatelab-sandbox-executor = { workspace = true }
user-profile = { workspace = true }

[tool.uv.workspace]
members = [
    "api",
    "buyer_history",
    "contracts",
    "mandate_engine",
    "sandbox_executor",
    "user_profile",
    "weee_cart",
]

[tool.pytest.ini_options]
addopts = "-ra"
pythonpath = [
    ".",
    "api/src",
    "contracts/src",
    "mandate_engine/src",
    "buyer_history/src",
    "weee_cart/src",
    "user_profile/src",
    "sandbox_executor/src",
]
